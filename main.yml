name: Fawa Exact 2Min Scheduler

on:
  schedule:
    - cron: '0 5 * * *' # roj sokal 5 AM UTC te start (10:30 AM IST)
  workflow_dispatch:

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # max 6 ghonta cholbe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Run Smart Scheduler
        run: python scheduler_bot.py
