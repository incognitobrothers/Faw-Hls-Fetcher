name: Update Live Events

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-live-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 Pillow

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Validate secrets and ZIP
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          set -e

          if [ -z "$ZIP_PASSWORD" ]; then
            echo "::error::ZIP_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$BASE_URL" ]; then
            echo "::error::BASE_URL secret is missing."
            exit 1
          fi

          if [ ! -f main.zip ]; then
            echo "::error::main.zip not found in repository root."
            exit 1
          fi

      - name: Extract main.py
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          set -e

          PRIVATE_DIR="$RUNNER_TEMP/private-code"
          mkdir -p "$PRIVATE_DIR"

          7z x main.zip \
            "-p${ZIP_PASSWORD}" \
            -y \
            "-o${PRIVATE_DIR}" \
            main.py

          test -f "$PRIVATE_DIR/main.py"

      - name: Run updater
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}
        run: |
          set -e
          python "$RUNNER_TEMP/private-code/main.py"

      - name: Commit and push updated files
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f -- playlist.m3u events.json

          if [ -d logos ]; then
            git add -f -- logos/
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update live events and match logos"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          else
            echo "No playlist, database, or logo changes."
          fi

      - name: Remove temporary source code
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private-code"
