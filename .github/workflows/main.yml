name: Update Playlist V1 

on:
  push:
    branches:
      - main
      - master

  schedule:
    - cron: '*/20 * * * *'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract main.zip
        run: |
          mkdir -p app
          unzip -o -P "${{ secrets.ZIP_PASSWORD }}" main.zip -d app

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Files
        run: |
          echo "Repository Root:"
          ls -la
          echo ""
          echo "App Folder:"
          ls -la app

      - name: Generate Playlist
        run: |
          cd app
          python main.py

      - name: Copy Playlist To Root
        run: |
          cp app/playlist.m3u8 ./playlist.m3u8

      - name: Commit And Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u8

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update playlist.m3u8"
            git push
          else
            echo "No changes detected."
          fi

      - name: Login To GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build And Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
