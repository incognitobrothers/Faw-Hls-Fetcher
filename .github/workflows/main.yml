
name: Update Live Events Playlist

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-live-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pyyaml

      - name: Initialize events database
        run: |
          if [ ! -f events.json ]; then
            echo '[]' > events.json
          fi

      - name: Run updater
        run: python main.py

      - name: Ensure output files exist
        run: |
          if [ ! -f events.json ]; then
            echo '[]' > events.json
          fi

          if [ ! -f playlist.m3u ]; then
            echo '#EXTM3U' > playlist.m3u
          fi

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u events.json

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update live events playlist"
            git push
          else
            echo "No changes to commit."
          fi
